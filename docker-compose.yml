services:
  # Spring Boot Backend API Service
  clinic-backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: clinic-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/clinic_db?allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: clinic_user
      SPRING_DATASOURCE_PASSWORD: 81ug]3F3g}[Quza;
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: JmRA2RT5R9J98Zmv
    networks:
      - sas-net

  clinic-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clinic-frontend
    restart: always
    depends_on:
      - clinic-backend
    ports:
      - "3200:80"
    networks:
      - sas-net
  
networks:
  sas-net:
    external: true