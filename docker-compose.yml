services:
  minio:
    image: minio/minio:latest
    container_name: clinic-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    ports:
      - "9001:9001"   # MinIO web console (optional, for admin access)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sas-net

  spring-backend:
    build: ./backend
    container_name: clinic-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/clinic_db?allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: clinic_user
      SPRING_DATASOURCE_PASSWORD: 81ug]3F3g}[Quza;
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - sas-net

  react-frontend:
    build: ./frontend
    container_name: clinic-frontend
    restart: always
    ports:
      - "3200:80"
    depends_on:
      - spring-backend
    networks:
      - sas-net

volumes:
  minio_data:
  
networks:
  sas-net:
    external: true